name: Region-locked game refresh (direct GH runner)

# region_restricted=true 게임(290개 정도)을 GitHub 러너에서 직접 메타스토어에 방문해서
# 갱신한다. 예전에 이 저장소에서 GH 러너 IP가 429를 맞은 적이 있지만(2026-09-05,
# 3초 딜레이·42분·약 340건에서 차단, scripts/refresh-region-locked.mjs 상단 주석 참고),
# 그건 지금보다 훨씬 빠른 페이스였다 — 서울 VPS가 20초 딜레이로 3,660건 이상 무차단
# 검증됐으므로, 같은 20초 딜레이로 다시 측정해본다. 차단 신호가 보이면 스크립트가
# 그 자리에서 멈추고 남은 건 다음 실행 때 이어서 처리한다(price_checked_at 순서 유지).
#
# 대상이 290개뿐이라 20초 딜레이로도 한 번 실행에 다 끝난다(약 1시간 40분) — 굳이
# thumbnail-backfill-cron처럼 자기 자신을 재트리거할 필요 없이, 그냥 몇 시간마다
# 다시 도는 걸로 충분하다.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: 이번 실행에서 처리할 개수 (기본 전체)
        required: false
        type: string
      delay:
        description: 게임 사이 대기시간(ms, 기본 20000)
        required: false
        type: string
        default: "20000"

permissions:
  contents: read

concurrency:
  group: region-locked-refresh-runner
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh region-locked games
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          node scripts/refresh-region-locked.mjs \
            ${{ inputs.limit && format('--limit={0}', inputs.limit) || '' }} \
            --delay-ms=${{ inputs.delay || '20000' }}
