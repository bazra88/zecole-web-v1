name: Refresh and sync Meta free games

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Discover new free games
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run data:free:discover

      - name: Refresh candidates, cache and parse
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run data:free:update

      - name: Apply validated changes
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npm run data:free:sync -- --apply

      - name: Write run summary
        if: always()
        run: node scripts/write-meta-free-summary.mjs

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: meta-free-report-${{ github.run_id }}
          path: |
            data/meta-free/candidates.*
            data/meta-free/discovery.*
            data/meta-free/parsed.*
            data/meta-free/diff-report.json
            data/meta-free/parse-report.json
            data/meta-free/sync-report.json
          if-no-files-found: error
