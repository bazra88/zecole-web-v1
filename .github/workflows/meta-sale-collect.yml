name: Test complete Meta catalog USD list
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a node scripts/collect-meta-full-list.mjs
        env:
          EXPECTED_CURRENCY: USD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meta-full-list-usd
          path: full-list-USD/
          retention-days: 14
