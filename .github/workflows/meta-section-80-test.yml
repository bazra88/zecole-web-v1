name: Meta section 80-item US test
on:
  push:
    branches: [codex/meta-section-80-us-test]
    paths:
      - scripts/test-meta-section-80.mjs
      - .github/workflows/meta-section-80-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a node scripts/test-meta-section-80.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meta-section-80-us-test
          path: meta-section-test/
          retention-days: 7
