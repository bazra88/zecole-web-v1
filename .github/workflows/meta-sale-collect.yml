name: Collect complete Meta sale USD list
on:
  workflow_dispatch:
  push:
    branches: [codex/meta-sale-sync]
    paths: [.github/workflows/meta-sale-collect.yml, scripts/collect-meta-sale.mjs]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a node scripts/collect-meta-sale.mjs
        env:
          EXPECTED_CURRENCY: USD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meta-sale-usd
          path: sale-USD/
          retention-days: 14
