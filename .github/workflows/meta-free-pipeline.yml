name: Refresh Meta free-game candidates

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh candidates, cache and parse
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run data:free:update

      - name: Upload reports
        uses: actions/upload-artifact@v6
        with:
          name: meta-free-report-${{ github.run_id }}
          path: |
            data/meta-free/candidates.*
            data/meta-free/parsed.*
            data/meta-free/diff-report.json
            data/meta-free/parse-report.json
          if-no-files-found: error
